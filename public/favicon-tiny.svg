<!-- Simplified GitPolis favicon for 16-32px: fewer, bolder shapes -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest">
  <title>GitPolis</title>
  <rect width="64" height="64" rx="14" fill="#0d1117"/>

  <!-- moon = Git logo diamond -->
  <rect x="39" y="9" width="14" height="14" rx="3" transform="rotate(45 46 16)" fill="#f05133"/>

  <!-- towers -->
  <rect x="8"  y="34" width="12" height="16" rx="1.5" fill="#6366f1"/>
  <rect x="22" y="18" width="14" height="32" rx="1.5" fill="#5eead4"/>
  <rect x="38" y="32" width="14" height="18" rx="1.5" fill="#6366f1"/>

  <!-- beacon commit node -->
  <rect x="27.5" y="12" width="3" height="7" fill="#5eead4"/>
  <circle cx="29" cy="10" r="4" fill="#0d1117" stroke="#5eead4" stroke-width="3"/>

  <!-- windows -->
  <g fill="#fde68a">
    <rect x="27" y="25" width="4.5" height="4.5" rx="1"/>
    <rect x="27" y="35" width="4.5" height="4.5" rx="1"/>
    <rect x="12" y="40" width="4.5" height="4.5" rx="1"/>
    <rect x="43" y="38" width="4.5" height="4.5" rx="1"/>
  </g>

  <!-- street + merge commit -->
  <line x1="8" y1="57" x2="56" y2="57" stroke="#5eead4" stroke-width="4" stroke-linecap="round"/>
  <circle cx="44" cy="57" r="4.5" fill="#f05133" stroke="#0d1117" stroke-width="1.5"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
