<!--
  git commit -m "feat: let there be light"
  git commit -m "fix: feed the cat"
  Easter eggs inside (spot them all):
   1. The moon is the Git logo: a diamond with a tiny branch fork inside.
   2. The tall tower's windows are a GitHub contribution graph.
   3. The antenna beacon is a commit node with a branch growing off it.
   4. The street is a git graph: a feature branch splits off and merges back.
   5. The orange dot where the branch merges is the merge commit.
   6. Dark windows with a green ring-dot are open issues.
   7. The cat on the rooftop is the codebase's mascot. It keeps watch over the repo.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest">
  <title>GitPolis</title>
  <desc>A night skyline whose street is a git branch graph and whose moon is the Git logo. A cat watches from a rooftop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2433"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="bld" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34466a"/>
      <stop offset="1" stop-color="#161d2e"/>
    </linearGradient>
    <!-- cat silhouette, sitting, tail curled up -->
    <g id="cat">
      <path d="M48.4 34 C48.4 30.6 49.4 28.6 51.5 28.6 C53.6 28.6 54.6 30.6 54.6 34 Z"/>
      <circle cx="51.5" cy="26.7" r="2.2"/>
      <path d="M49.5 25.8 L49.5 23.2 L51.2 24.7 Z"/>
      <path d="M53.5 25.8 L53.5 23.2 L51.8 24.7 Z"/>
      <path d="M54.3 34 C58 34 58.2 28.8 56.2 28.8 L55.7 30 C56.9 30.2 56.6 32.7 54.3 32.7 Z"/>
    </g>
    <!-- "open issue" window: dark pane + green ring-dot -->
    <g id="issue">
      <rect width="2.6" height="2.8" rx=".5" fill="#0a0e14"/>
      <circle cx="1.3" cy="1.4" r=".85" fill="none" stroke="#3fb950" stroke-width=".35"/>
      <circle cx="1.3" cy="1.4" r=".28" fill="#3fb950"/>
    </g>
  </defs>

  <!-- night sky -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <g fill="#fff" opacity=".7">
    <circle cx="11" cy="10" r=".8"/>
    <circle cx="13" cy="22" r=".6"/>
    <circle cx="36" cy="11" r=".7"/>
    <circle cx="58" cy="28" r=".6"/>
  </g>

  <!-- moon = Git logo -->
  <rect x="43.5" y="7.5" width="11" height="11" rx="2" transform="rotate(45 49 13)" fill="#f05133"/>
  <g stroke="#0d1117" stroke-width="1.2" stroke-linecap="round" fill="none">
    <line x1="49" y1="9.8" x2="49" y2="16.4"/>
    <line x1="49" y1="14" x2="52" y2="11.4"/>
  </g>
  <g fill="#0d1117">
    <circle cx="49" cy="9.8" r="1.3"/>
    <circle cx="49" cy="16.4" r="1.3"/>
    <circle cx="52" cy="11.4" r="1.3"/>
  </g>

  <!-- skyline -->
  <rect x="8"  y="32" width="10" height="16" rx="1" fill="url(#bld)"/>
  <rect x="20" y="14" width="12" height="34" rx="1" fill="url(#bld)"/>
  <rect x="34" y="24" width="10" height="24" rx="1" fill="url(#bld)"/>
  <rect x="46" y="34" width="10" height="14" rx="1" fill="url(#bld)"/>
  <g fill="#5eead4">
    <rect x="8"  y="32" width="10" height="1.4" rx=".7"/>
    <rect x="20" y="14" width="12" height="1.4" rx=".7"/>
    <rect x="34" y="24" width="10" height="1.4" rx=".7"/>
    <rect x="46" y="34" width="10" height="1.4" rx=".7"/>
  </g>

  <!-- tall tower: windows = contribution graph -->
  <g>
    <rect x="21.9" y="18"   width="3.2" height="3.2" rx=".6" fill="#26a641"/>
    <rect x="26.9" y="18"   width="3.2" height="3.2" rx=".6" fill="#0e4429"/>
    <rect x="21.9" y="23.5" width="3.2" height="3.2" rx=".6" fill="#39d353"/>
    <rect x="26.9" y="23.5" width="3.2" height="3.2" rx=".6" fill="#006d32"/>
    <rect x="21.9" y="29"   width="3.2" height="3.2" rx=".6" fill="#0e4429"/>
    <rect x="26.9" y="29"   width="3.2" height="3.2" rx=".6" fill="#39d353"/>
    <rect x="21.9" y="34.5" width="3.2" height="3.2" rx=".6" fill="#006d32"/>
    <rect x="26.9" y="34.5" width="3.2" height="3.2" rx=".6" fill="#26a641"/>
    <rect x="21.9" y="40"   width="3.2" height="3.2" rx=".6" fill="#39d353"/>
    <rect x="26.9" y="40"   width="3.2" height="3.2" rx=".6" fill="#39d353"/>
  </g>

  <!-- lit windows -->
  <g fill="#fde68a">
    <rect x="11"   y="37" width="2.4" height="2.8" rx=".5"/>
    <rect x="37"   y="29" width="2.4" height="2.8" rx=".5"/>
    <rect x="37"   y="39" width="2.4" height="2.8" rx=".5"/>
    <rect x="49"   y="39" width="2.4" height="2.8" rx=".5"/>
    <rect x="52.5" y="43" width="2.4" height="2.8" rx=".5"/>
  </g>

  <!-- open issues: dark windows -->
  <use xlink:href="#issue" href="#issue" x="14.3" y="41.8"/>
  <use xlink:href="#issue" href="#issue" x="40.3" y="33.8"/>

  <!-- rooftop cat: teal rim light, dark body, glowing eyes -->
  <use xlink:href="#cat" href="#cat" fill="#5eead4" stroke="#5eead4" stroke-width="1" stroke-linejoin="round" opacity=".7"/>
  <use xlink:href="#cat" href="#cat" fill="#0a0e14"/>
  <g fill="#fde68a">
    <circle cx="50.7" cy="26.6" r=".55"/>
    <circle cx="52.3" cy="26.6" r=".55"/>
  </g>

  <!-- antenna = commit node with a branch -->
  <line x1="26" y1="14" x2="26" y2="9.5" stroke="#5eead4" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M26 12 C26 9.5 28.5 9.5 31 7.5" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="31.5" cy="7" r="1.6" fill="#c084fc"/>
  <circle cx="26" cy="7" r="2.8" fill="#0d1117" stroke="#5eead4" stroke-width="1.8">
    <animate attributeName="stroke-opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- street = git graph -->
  <line x1="9" y1="57" x2="55" y2="57" stroke="#5eead4" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M21 57 C25 57 25 53 29 53 H41 C45 53 45 57 49 57" fill="none" stroke="#c084fc" stroke-width="1.6" stroke-linecap="round"/>
  <g fill="#0d1117" stroke="#5eead4" stroke-width="1.4">
    <circle cx="9"  cy="57" r="2"/>
    <circle cx="21" cy="57" r="2"/>
    <circle cx="55" cy="57" r="2"/>
  </g>
  <g fill="#c084fc">
    <circle cx="32" cy="53" r="1.7"/>
    <circle cx="38" cy="53" r="1.7"/>
  </g>
  <!-- merge commit -->
  <circle cx="49" cy="57" r="2.3" fill="#f05133"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
